appId: com.local.taskkanban
productName: 任务看板
directories:
  output: dist
files:
  - src/**
  - assets/**
  - package.json
asarUnpack:
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
win:
  target:
    - portable
  icon: assets/icon.png
  signAndEditExecutable: false
afterPack: ./after-pack.js
portable:
  artifactName: "任务看板-${version}.exe"
