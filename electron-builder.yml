appId: com.local.taskkanban
productName: 任务看板
directories:
  output: dist
files:
  - src/**
  - assets/**
  - package.json
asarUnpack:
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
win:
  target:
    - portable
  icon: assets/icon.png
  signAndEditExecutable: false
afterPack: ./after-pack.js
portable:
  # 用 ASCII 文件名：GitHub Release 上传中文名常被剥成「-1.0.x.exe」，导致检查更新 404
  artifactName: "task-kanban-${version}.exe"
