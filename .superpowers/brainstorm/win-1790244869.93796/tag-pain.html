<h2>新建 / 编辑的标签，你最想先解决哪件事？</h2>
<p class="subtitle">当前是一排可点的胶囊：选中变色。标签一多，很难一眼看出选了哪些、有没有建过。</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>分清已选</h3>
      <p>选中的标签和没选的混在一起，扫一眼分不清</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>方便查找</h3>
      <p>标签太多，要找某个或新建时不好找（缺搜索）</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>两个都要</h3>
      <p>既要一眼看出已选，又要方便搜索 / 新建</p>
    </div>
  </div>
</div>
