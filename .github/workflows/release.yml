name: Release

# - 推送到 main 且 package.json 的 version 有变化 → 自动打 tag 并打包发版
# - 手动推送 v* tag → 同样打包发版（兼容旧流程）
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide version / tag
        id: meta
        shell: bash
        run: |
          set -e
          PKG="$(node -p "require('./package.json').version")"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VER="${TAG#v}"
            echo "触发方式=手动 tag  tag=$TAG  package.json=$PKG"
            if [ "$VER" != "$PKG" ]; then
              echo "::error::Tag $TAG 与 package.json 的 version($PKG) 不一致"
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main 分支：仅当 version 相对上一提交有变化时发版
          NEW="$PKG"
          OLD=""
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            OLD="$(git show HEAD~1:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}}")"
          fi
          echo "触发方式=main  old=${OLD:-none}  new=$NEW"

          if [ -n "$OLD" ] && [ "$OLD" = "$NEW" ]; then
            echo "version 未变化，跳过发版"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v$NEW"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "本地已有 tag $TAG，跳过"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "远程已有 tag $TAG，跳过"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.meta.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        if: steps.meta.outputs.should_release == 'true'
        run: npm ci

      - name: Build portable exe
        if: steps.meta.outputs.should_release == 'true'
        run: npm run build

      - name: Create tag + GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 任务看板 ${{ steps.meta.outputs.tag }}
          files: |
            dist/任务看板-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
